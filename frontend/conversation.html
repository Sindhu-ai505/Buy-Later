<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Questions — BuyLater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">BL</div>
        <span class="brand-title">BuyLater</span>
      </a>
      <ul class="nav-links">
        <li><span id="nav-personality-badge" class="personality-chip">Persona: Best Friend</span></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="chat-window">
      <!-- Progress Bar -->
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar" style="width: 20%;"></div>
      </div>

      <div class="chat-header">
        <div>
          <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); font-weight:700;">Evaluating</span>
          <h2 id="eval-product-title" style="font-size:1.1rem; font-weight:800; color:var(--text-main);">Product Assessment</h2>
        </div>
        <span id="progress-text" style="font-size:0.85rem; font-weight:700; color:var(--primary);">Step 1</span>
      </div>

      <div class="chat-body">
        <div class="assistant-bubble">
          <div class="assistant-avatar">🤖</div>
          <div id="question-text" class="assistant-text">
            Loading your question...
          </div>
        </div>

        <!-- Choice Options Container -->
        <div id="options-container" class="answer-options">
          <!-- Dynamically populated buttons -->
        </div>

        <!-- Text Input Container (Fallback/Custom) -->
        <div id="text-input-container" style="display:none; margin-top:1rem;">
          <form onsubmit="handleCustomTextSubmit(event)">
            <div class="form-group">
              <input type="text" id="custom-answer-input" class="form-input" placeholder="Type your answer here..." required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Submit Answer →</button>
          </form>
        </div>

        <!-- Calculating Indicator -->
        <div id="calculating-indicator" style="display:none; text-align:center; padding:2rem;">
          <div style="font-size:2.5rem; margin-bottom:1rem; animation: pulse 1.5s infinite;">🧠</div>
          <h3 style="font-weight:800; margin-bottom:0.5rem;">Synthesizing Deep Learning Features...</h3>
          <p style="color:var(--text-muted); font-size:0.9rem;">
            Calculating impulse probability, factoring budget metrics, and generating personalized advice.
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js?v=2.0"></script>
  <script>
    let activeAnalysisId = null;
    let currentQuestionData = null;
    let stepCount = 1;

    document.addEventListener("DOMContentLoaded", async () => {
      activeAnalysisId = sessionStorage.getItem("active_analysis_id");
      const prodName = sessionStorage.getItem("product_name") || "Product";
      document.getElementById("eval-product-title").textContent = prodName;

      if (!activeAnalysisId) {
        window.location.href = "index.html";
        return;
      }

      const storedQ = sessionStorage.getItem("current_question");
      if (storedQ) {
        currentQuestionData = JSON.parse(storedQ);
        renderQuestion(currentQuestionData);
      } else {
        const info = await apiRequest(`/analysis/${activeAnalysisId}`);
        currentQuestionData = info.next_question;
        renderQuestion(currentQuestionData);
      }
    });

    function renderQuestion(q) {
      if (q.is_final) {
        showCalculatingState();
        return;
      }

      document.getElementById("question-text").textContent = q.question_text;
      document.getElementById("progress-bar").style.width = `${q.progress_percentage || 25}%`;
      document.getElementById("progress-text").textContent = `Question ${stepCount}`;

      const optionsBox = document.getElementById("options-container");
      const textBox = document.getElementById("text-input-container");
      optionsBox.innerHTML = "";

      if (q.options && q.options.length > 0) {
        textBox.style.display = "none";
        optionsBox.style.display = "flex";

        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";
          btn.innerHTML = `<span>${opt.label}</span> <span>→</span>`;
          btn.onclick = () => selectOption(opt.value, opt.label);
          optionsBox.appendChild(btn);
        });
      } else {
        optionsBox.style.display = "none";
        textBox.style.display = "block";
      }
    }

    async function selectOption(answerValue, answerLabel) {
      stepCount++;
      // Disable options to prevent double-click
      document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);

      try {
        const res = await submitAnswer(
          activeAnalysisId,
          currentQuestionData.question_key,
          currentQuestionData.question_text,
          answerValue
        );

        if (res.is_final) {
          showCalculatingState();
          setTimeout(() => {
            window.location.href = "result.html";
          }, 1000);
        } else {
          currentQuestionData = res.next_question;
          renderQuestion(currentQuestionData);
        }
      } catch (err) {
        showToast("Error recording answer: " + err.message, true);
        document.querySelectorAll(".option-btn").forEach(b => b.disabled = false);
      }
    }

    async function handleCustomTextSubmit(e) {
      e.preventDefault();
      const val = document.getElementById("custom-answer-input").value;
      await selectOption(val, val);
    }

    function showCalculatingState() {
      document.getElementById("options-container").style.display = "none";
      document.getElementById("text-input-container").style.display = "none";
      document.getElementById("question-text").parentElement.style.display = "none";
      document.getElementById("calculating-indicator").style.display = "block";
      document.getElementById("progress-bar").style.width = "100%";
      document.getElementById("progress-text").textContent = "Done";
    }
  </script>
</body>
</html>
